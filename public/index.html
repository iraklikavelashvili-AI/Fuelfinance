<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuelFinance Workflows</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      min-height: 100vh;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .logo {
      width: 32px; height: 32px;
      background: #22c55e;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 13px; color: #64748b; margin-left: auto; }

    .container { max-width: 860px; margin: 0 auto; padding: 36px 20px 60px; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 36px 0 12px;
    }
    .section-label:first-child { margin-top: 0; }

    .card {
      background: white;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 20px 24px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

    .card-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .card-text { flex: 1; min-width: 0; }
    .card-text h2 { font-size: 15px; font-weight: 600; }
    .card-text p  { font-size: 13px; color: #64748b; margin-top: 2px; }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .card-meta span { font-size: 11px; color: #cbd5e1; }
    .steps-toggle {
      font-size: 11px;
      color: #22c55e;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .steps-toggle:hover { color: #16a34a; }

    .steps-list {
      display: none;
      margin-top: 14px;
      border-top: 1px solid #f1f5f9;
      padding-top: 14px;
    }
    .steps-list.open { display: block; }
    .steps-list ol {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .steps-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: #475569;
    }
    .step-num {
      width: 22px; height: 22px;
      background: #f1f5f9;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .btn-edit {
      background: none;
      color: #64748b;
      border: 1.5px solid #e2e8f0;
      padding: 0 16px;
      height: 40px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-edit:hover { border-color: #94a3b8; color: #1e293b; }
    .btn-edit.active { background: #f1f5f9; border-color: #94a3b8; color: #1e293b; }

    .edit-panel {
      display: none;
      margin-top: 16px;
      border-top: 1px solid #f1f5f9;
      padding-top: 16px;
    }
    .edit-panel.open { display: block; }

    .edit-panel label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #94a3b8;
      display: block;
      margin-bottom: 8px;
    }
    .edit-panel textarea {
      width: 100%;
      height: 320px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      color: #1e293b;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    .edit-panel textarea:focus { border-color: #22c55e; }

    .edit-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-save {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0 20px;
      height: 36px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #15803d; }
    .btn-cancel-edit {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      padding: 0 8px;
      height: 36px;
    }
    .btn-cancel-edit:hover { color: #64748b; }
    .save-msg {
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    .save-msg.ok  { color: #16a34a; }
    .save-msg.err { color: #dc2626; }

    .btn-run {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0 22px;
      height: 40px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .btn-run:hover:not(:disabled) { background: #15803d; transform: translateY(-1px); }
    .btn-run:active { transform: translateY(0); }
    .btn-run:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .btn-run.running  { background: #d97706; }
    .btn-run.done-ok  { background: #16a34a; }
    .btn-run.done-err { background: #dc2626; }

    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .status-dot.running { background: #f59e0b; animation: blink 0.9s infinite; }
    .status-dot.ok      { background: #22c55e; }
    .status-dot.err     { background: #ef4444; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .log-wrap { margin-top: 16px; display: none; }
    .log-wrap.open { display: block; }

    .log-header {
      background: #1e293b;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 8px 8px 0 0;
    }
    .log-box {
      background: #0f172a;
      border-radius: 0 0 8px 8px;
      padding: 12px 14px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12.5px;
      line-height: 1.65;
      color: #94a3b8;
      max-height: 300px;
      overflow-y: auto;
    }
    .log-box .ok    { color: #4ade80; }
    .log-box .fail  { color: #f87171; }
    .log-box .head  { color: #38bdf8; }
    .log-box .muted { color: #334155; }

    .log-box::-webkit-scrollbar { width: 5px; }
    .log-box::-webkit-scrollbar-track { background: transparent; }
    .log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .empty { text-align: center; padding: 80px 0; color: #94a3b8; }
  </style>
</head>
<body>

<header>
  <div class="logo">F</div>
  <h1>FuelFinance Workflows</h1>
  <p>Click RUN to execute a workflow automatically</p>
</header>

<div class="container" id="app">
  <div class="empty">Loading workflows…</div>
</div>

<script>
  const FOLDER_LABELS = { shared: 'Shared' };
  function folderLabel(f) {
    return FOLDER_LABELS[f] || ('Project: ' + f.charAt(0).toUpperCase() + f.slice(1));
  }

  async function load() {
    const wfs = await fetch('/api/workflows').then(r => r.json());
    const app = document.getElementById('app');
    app.innerHTML = '';

    if (!wfs.length) {
      app.innerHTML = '<div class="empty">No workflows found. Add .yaml files to the workflows/ folder.</div>';
      return;
    }

    const groups = {};
    wfs.forEach(w => { (groups[w.folder] = groups[w.folder] || []).push(w); });

    for (const [folder, items] of Object.entries(groups)) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = folderLabel(folder);
      app.appendChild(label);
      items.forEach(w => app.appendChild(makeCard(w)));
    }
  }

  function makeCard(wf) {
    const card = document.createElement('div');
    card.className = 'card';

    const stepItems = (wf.stepList || [])
      .map((name, i) => `<li><div class="step-num">${i + 1}</div><span>${name}</span></li>`)
      .join('');

    card.innerHTML = `
      <div class="card-row">
        <div class="card-icon">⚡</div>
        <div class="card-text">
          <h2>${wf.name}</h2>
          <p>${wf.description || '—'}</p>
          <div class="card-meta">
            <span>${wf.steps} steps</span>
            <span>·</span>
            <span>${wf.file}</span>
            <button class="steps-toggle" onclick="toggleSteps('${wf.id}', this)">Show steps</button>
          </div>
        </div>
        <div class="status-dot" id="dot-${wf.id}"></div>
        <button class="btn-edit" id="editbtn-${wf.id}" onclick="toggleEdit('${wf.file}','${wf.id}')">✏️ Edit</button>
        <button class="btn-run" id="btn-${wf.id}" onclick="runWorkflow('${wf.file}','${wf.id}')">▶ RUN</button>
      </div>

      <div class="steps-list" id="steps-${wf.id}">
        <ol>${stepItems}</ol>
      </div>

      <div class="edit-panel" id="edit-${wf.id}">
        <label>Edit steps — change names, actions, or values below, then click Save</label>
        <textarea id="editarea-${wf.id}" spellcheck="false"></textarea>
        <div class="edit-actions">
          <button class="btn-save" onclick="saveWorkflow('${wf.file}','${wf.id}')">Save</button>
          <button class="btn-cancel-edit" onclick="toggleEdit('${wf.file}','${wf.id}')">Cancel</button>
          <span class="save-msg" id="savemsg-${wf.id}"></span>
        </div>
      </div>

      <div class="log-wrap" id="wrap-${wf.id}">
        <div class="log-header"><span id="log-status-${wf.id}">● Live output</span></div>
        <div class="log-box" id="log-${wf.id}"></div>
      </div>
    `;
    return card;
  }

  async function toggleEdit(file, id) {
    const panel  = document.getElementById('edit-' + id);
    const btn    = document.getElementById('editbtn-' + id);
    const area   = document.getElementById('editarea-' + id);
    const msg    = document.getElementById('savemsg-' + id);
    const isOpen = panel.classList.contains('open');

    if (isOpen) {
      panel.classList.remove('open');
      btn.classList.remove('active');
    } else {
      msg.style.display = 'none';
      const res = await fetch('/api/workflow-content?file=' + encodeURIComponent(file));
      const data = await res.json();
      area.value = data.content;
      panel.classList.add('open');
      btn.classList.add('active');
      area.focus();
    }
  }

  async function saveWorkflow(file, id) {
    const area   = document.getElementById('editarea-' + id);
    const msg    = document.getElementById('savemsg-' + id);
    const panel  = document.getElementById('edit-' + id);

    msg.style.display = 'none';
    const res = await fetch('/api/workflow-content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file, content: area.value }),
    });
    const data = await res.json();

    if (data.ok) {
      msg.textContent = '✓ Saved!';
      msg.className = 'save-msg ok';
      msg.style.display = 'inline';
      panel.classList.remove('open');
      document.getElementById('editbtn-' + id).classList.remove('active');
      load(); // refresh step counts
    } else {
      msg.textContent = '✗ ' + data.error;
      msg.className = 'save-msg err';
      msg.style.display = 'inline';
    }
  }

  function toggleSteps(id, btn) {
    const list = document.getElementById('steps-' + id);
    const open = list.classList.toggle('open');
    btn.textContent = open ? 'Hide steps' : 'Show steps';
  }

  function classify(text) {
    if (/✓/.test(text))              return 'ok';
    if (/✗|ERROR/.test(text))        return 'fail';
    if (/^={3,}/.test(text.trim()))  return 'head';
    if (!text.trim())                return 'muted';
    return '';
  }

  function appendLog(id, text, cls) {
    const box = document.getElementById('log-' + id);
    if (!box) return;
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function runWorkflow(file, id) {
    const btn    = document.getElementById('btn-' + id);
    const dot    = document.getElementById('dot-' + id);
    const wrap   = document.getElementById('wrap-' + id);
    const logBox = document.getElementById('log-' + id);
    const status = document.getElementById('log-status-' + id);

    logBox.innerHTML = '';
    wrap.classList.add('open');
    btn.disabled = true;
    btn.className = 'btn-run running';
    btn.textContent = '⏳ Running…';
    dot.className = 'status-dot running';
    status.textContent = '● Running…';

    const es = new EventSource('/api/run?file=' + encodeURIComponent(file));

    es.onmessage = e => {
      const { type, text } = JSON.parse(e.data);
      if (type === 'log')   appendLog(id, text, classify(text));
      if (type === 'error') appendLog(id, text, 'fail');
      if (type === 'done') {
        es.close();
        const ok = text === 'success';
        btn.disabled = false;
        btn.className = 'btn-run ' + (ok ? 'done-ok' : 'done-err');
        btn.textContent = '▶ RUN';
        dot.className   = 'status-dot ' + (ok ? 'ok' : 'err');
        status.textContent = ok ? '✓ Completed successfully' : '✗ Failed — see output above';
      }
    };

    es.onerror = () => {
      es.close();
      btn.disabled = false;
      btn.className = 'btn-run';
      btn.textContent = '▶ RUN';
      dot.className = 'status-dot err';
    };
  }

  load();
</script>
</body>
</html>
