<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuelFinance Workflows</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── header ── */
    header {
      background: #0f172a;
      color: white;
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .logo {
      width: 32px; height: 32px;
      background: #22c55e;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: white;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 13px; color: #64748b; margin-left: auto; }

    /* ── layout ── */
    .container { max-width: 860px; margin: 0 auto; padding: 36px 20px 60px; }

    /* ── section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 36px 0 12px;
    }
    .section-label:first-child { margin-top: 0; }

    /* ── card ── */
    .card {
      background: white;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 20px 24px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

    .card-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .card-text { flex: 1; min-width: 0; }
    .card-text h2 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-text p  { font-size: 13px; color: #64748b; margin-top: 2px; }
    .card-meta    { font-size: 11px; color: #cbd5e1; margin-top: 5px; }

    /* ── run button ── */
    .btn-run {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0 22px;
      height: 40px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .btn-run:hover:not(:disabled) { background: #15803d; transform: translateY(-1px); }
    .btn-run:active { transform: translateY(0); }
    .btn-run:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .btn-run.running { background: #d97706; }
    .btn-run.done-ok { background: #16a34a; }
    .btn-run.done-err { background: #dc2626; }

    /* ── status indicator ── */
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #e2e8f0;
      flex-shrink: 0;
    }
    .status-dot.running { background: #f59e0b; animation: blink 0.9s infinite; }
    .status-dot.ok      { background: #22c55e; }
    .status-dot.err     { background: #ef4444; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── log panel ── */
    .log-wrap { margin-top: 16px; display: none; }
    .log-wrap.open { display: block; }

    .log-header {
      background: #1e293b;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 8px 8px 0 0;
      display: flex; align-items: center; gap: 8px;
    }

    .log-box {
      background: #0f172a;
      border-radius: 0 0 8px 8px;
      padding: 12px 14px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12.5px;
      line-height: 1.65;
      color: #94a3b8;
      max-height: 300px;
      overflow-y: auto;
    }
    .log-box .ok    { color: #4ade80; }
    .log-box .fail  { color: #f87171; }
    .log-box .head  { color: #38bdf8; }
    .log-box .muted { color: #475569; }

    /* scrollbar */
    .log-box::-webkit-scrollbar { width: 5px; }
    .log-box::-webkit-scrollbar-track { background: transparent; }
    .log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* ── empty state ── */
    .empty { text-align: center; padding: 80px 0; color: #94a3b8; }
    .empty h2 { font-size: 18px; margin-bottom: 8px; }
  </style>
</head>
<body>

<header>
  <div class="logo">F</div>
  <h1>FuelFinance Workflows</h1>
  <p>Click RUN to execute a workflow automatically</p>
</header>

<div class="container" id="app">
  <div class="empty"><h2>Loading workflows…</h2></div>
</div>

<script>
  const FOLDER_LABELS = {
    shared: 'Shared',
  };

  function folderLabel(f) {
    return FOLDER_LABELS[f] || ('Project: ' + f.charAt(0).toUpperCase() + f.slice(1));
  }

  async function load() {
    const wfs = await fetch('/api/workflows').then(r => r.json());
    const app = document.getElementById('app');
    app.innerHTML = '';

    if (!wfs.length) {
      app.innerHTML = '<div class="empty"><h2>No workflows found</h2><p>Add .yaml files to the workflows/ folder.</p></div>';
      return;
    }

    // group by folder
    const groups = {};
    wfs.forEach(w => { (groups[w.folder] = groups[w.folder] || []).push(w); });

    for (const [folder, items] of Object.entries(groups)) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = folderLabel(folder);
      app.appendChild(label);
      items.forEach(w => app.appendChild(makeCard(w)));
    }
  }

  function makeCard(wf) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + wf.id;
    card.innerHTML = `
      <div class="card-row">
        <div class="card-icon">⚡</div>
        <div class="card-text">
          <h2>${wf.name}</h2>
          <p>${wf.description || '—'}</p>
          <div class="card-meta">${wf.steps} steps &nbsp;·&nbsp; ${wf.file}</div>
        </div>
        <div class="status-dot" id="dot-${wf.id}"></div>
        <button class="btn-run" id="btn-${wf.id}" onclick="runWorkflow('${wf.file}','${wf.id}')">
          ▶ RUN
        </button>
      </div>
      <div class="log-wrap" id="wrap-${wf.id}">
        <div class="log-header">
          <span id="log-status-${wf.id}">● Live output</span>
        </div>
        <div class="log-box" id="log-${wf.id}"></div>
      </div>
    `;
    return card;
  }

  function classify(text) {
    if (/✓/.test(text))           return 'ok';
    if (/✗|ERROR/.test(text))     return 'fail';
    if (/^={3,}/.test(text.trim())) return 'head';
    if (!text.trim())             return 'muted';
    return '';
  }

  function appendLog(boxId, text, cls) {
    const box = document.getElementById(boxId);
    if (!box) return;
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function runWorkflow(file, id) {
    const btn    = document.getElementById('btn-' + id);
    const dot    = document.getElementById('dot-' + id);
    const wrap   = document.getElementById('wrap-' + id);
    const logBox = document.getElementById('log-' + id);
    const status = document.getElementById('log-status-' + id);

    logBox.innerHTML = '';
    wrap.classList.add('open');
    btn.disabled = true;
    btn.className = 'btn-run running';
    btn.textContent = '⏳ Running…';
    dot.className = 'status-dot running';
    status.textContent = '● Running…';

    const es = new EventSource('/api/run?file=' + encodeURIComponent(file));

    es.onmessage = e => {
      const { type, text } = JSON.parse(e.data);

      if (type === 'log')   appendLog('log-' + id, text, classify(text));
      if (type === 'error') appendLog('log-' + id, text, 'fail');

      if (type === 'done') {
        es.close();
        const ok = text === 'success';
        btn.disabled = false;
        btn.className = 'btn-run ' + (ok ? 'done-ok' : 'done-err');
        btn.textContent = '▶ RUN';
        dot.className   = 'status-dot ' + (ok ? 'ok' : 'err');
        status.textContent = ok ? '✓ Completed successfully' : '✗ Failed — see output above';
      }
    };

    es.onerror = () => {
      es.close();
      btn.disabled = false;
      btn.className = 'btn-run';
      btn.textContent = '▶ RUN';
      dot.className = 'status-dot err';
    };
  }

  load();
</script>
</body>
</html>
